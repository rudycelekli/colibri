name: Fork-only thirty-fix validation
on:
  push:
    branches: [validation/colibri-thirty-gate-20261017]
permissions:
  contents: read
jobs:
  combined:
    if: github.repository == 'rudycelekli/colibri'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 458b24d381686ee77bd469f99ad3cc9c5bf87959
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact combined source
        run: test "$(git rev-parse HEAD)" = 458b24d381686ee77bd469f99ad3cc9c5bf87959
      - name: Dependency-free full CPU gate
        run: make -C c -j"$(nproc)" check
      - name: Install pinned oracle dependencies
        run: python -m pip install -r c/tools/requirements-glm53-tiny.txt
      - name: Strict generated GLM oracle
        working-directory: c
        run: |
          python tools/make_glm_oracle.py
          SNAP=./glm_tiny TF=1 COLI_TEMP=0 ORACLE_STRICT=1 ORACLE_TF_MAX_MISMATCHES=2 ./colibri 64 16 16
          SNAP=./glm_tiny COLI_TEMP=0 ORACLE_STRICT=1 ./colibri 64 16 16
          python tests/test_glm_oracle.py
      - name: Python suite with oracle dependencies available
        run: python -m unittest discover -s c/tests -p 'test_*.py'
      - name: Verify tracked sources remain unchanged
        run: git diff --exit-code
